<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泉州价格体系核算系统</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: #f0f2f5; color: #222; font-size: 14px; }
  header { background: #14532d; color: #fff; padding: 10px 20px; }
  header h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  nav button { background: rgba(255,255,255,.12); color: #fff; border: 0; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  nav button.active { background: #fff; color: #14532d; font-weight: 600; }
  .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #ddd; padding: 8px 20px; position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .toolbar label { color: #555; }
  .toolbar select { padding: 4px 6px; max-width: 210px; }
  .toolbar input[type=number] { width: 60px; }
  main { max-width: 1600px; margin: 16px auto 60px; padding: 0 16px; }
  .panel { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .panel h3 { margin: 2px 0 12px; font-size: 16px; border-left: 4px solid #14532d; padding-left: 8px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d9dee5; padding: 5px 8px; text-align: left; vertical-align: middle; }
  th { background: #f5f6f8; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { background: #f7f9fc; font-weight: 600; }
  tr.hl td { background: #fffbe6; font-weight: 600; }
  input[type=number], input[type=text] { border: 1px solid #ccd2da; border-radius: 3px; padding: 3px 5px; width: 90px; }
  td input[type=number] { width: 78px; text-align: right; }
  td input[type=text] { width: 100%; min-width: 70px; }
  select { max-width: 320px; }
  button { cursor: pointer; }
  .btn { background: #14532d; color: #fff; border: 0; border-radius: 4px; padding: 6px 14px; font-size: 13px; }
  .btn.light { background: #eef1f5; color: #333; border: 1px solid #ccd2da; }
  .btn.danger { background: #d9534f; }
  .chip { display: inline-block; background: #eef1f5; border: 1px solid #ccd2da; color: #333; border-radius: 14px; padding: 4px 14px; margin: 0 6px 6px 0; cursor: pointer; font-size: 13px; }
  .chip.active { background: #14532d; color: #fff; border-color: #14532d; }
  .hint { color: #888; font-size: 12px; }
  .unmatched { background: #fff3f3; }
  tr.unmatched td { background: #fff3f3; }
  .wrap { overflow-x: auto; }
  .brand-table { min-width: 1150px; }
  .brand-table th, .brand-table td { padding: 4px 8px; }
  .detail-table { min-width: 3100px; }
  .chip-add { border-style: dashed; color: #14532d; }
  .detail-table th, .detail-table td { padding: 4px 6px; }
  .metric-table { min-width: 2400px; }
  .metric-table td:first-child, .metric-table th:first-child { position: sticky; left: 0; background: #fff; z-index: 2; }
  .metric-table th:first-child { background: #f5f6f8; }
  .book-table { min-width: 2200px; }
  .book-table td { padding: 3px 4px; }
  .btn-tag { display: inline-block; font-size: 11px; color: #14532d; background: #e8f5ec; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  .x-btn { background: transparent; border: 0; color: #b33; font-weight: 700; margin-left: 4px; padding: 0 2px; }
  .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  @media print {
    body { background: #fff; }
    header nav, .toolbar, .no-print { display: none !important; }
    main { max-width: none; margin: 0; padding: 0; }
    .panel { border: none; box-shadow: none; padding: 0; margin-bottom: 14px; }
    input { border: none !important; }
  }
  /* 登录遮罩 */
  #loginMask { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #14532d 0%, #1e7a3f 100%); display: flex; align-items: center; justify-content: center; }
  #loginMask .login-box { background: #fff; border-radius: 12px; padding: 32px 36px; width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  #loginMask .login-box h2 { text-align: center; margin: 0 0 6px; color: #14532d; font-size: 22px; }
  #loginMask .login-box .sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 22px; }
  #loginMask .login-box label { display: block; color: #555; font-size: 13px; margin: 12px 0 4px; }
  #loginMask .login-box input { width: 100%; border: 1px solid #ccd2da; border-radius: 6px; padding: 9px 12px; font-size: 15px; }
  #loginMask .login-box input:focus { outline: none; border-color: #14532d; box-shadow: 0 0 0 3px rgba(20,83,45,.12); }
  #loginMask .login-box .login-btn { width: 100%; margin-top: 20px; background: #14532d; color: #fff; border: 0; border-radius: 6px; padding: 11px; font-size: 15px; cursor: pointer; }
  #loginMask .login-box .login-btn:hover { background: #1e7a3f; }
  #loginMask .login-box .err { color: #d9534f; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
</style>
</head>

/* ---------- 基础工具 ---------- */
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function esc(s) { return (s == null ? '' : '' + s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt2(x) { if (!isFinite(x)) x = 0; return x.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtQ(x) { if (!isFinite(x)) x = 0; return x.toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }
function num(v) { var f = parseFloat(v); return isNaN(f) ? 0 : f; }
function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }

/* ---------- 状态 ---------- */
function loadState() {
  try {
    var raw = localStorage.getItem(LSKEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.products && s.orders && s.brands) return s;
    }
  } catch (e) {}
  return deepCopy(SEED);
}
var state = loadState();
function save() { try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch (e) { alert('保存失败：浏览器存储空间不足'); } }

function migrate() {
  if (!state.view) state.view = {};
  var v = state.view;
  if (['orders', 'summary', 'books', 'data'].indexOf(v.tab) < 0) v.tab = 'orders';
  if (['price', 'retail', 'welfare', 'cost'].indexOf(v.book) < 0) v.book = 'retail';
  if (SALES_MODE && v.book === 'cost') v.book = 'retail';
  if (!v.order || !state.orders[v.order]) {
    var first = null;
    for (var k in state.orders) { if (!first) first = k; }
    v.order = first;
  }
  v.brandCount = parseInt(v.brandCount, 10);
  if (!isFinite(v.brandCount)) v.brandCount = 4;
  v.brandCount = Math.max(2, Math.min(10, v.brandCount));
  var bn = v.brandCount;
  if (!Array.isArray(v.coefs)) v.coefs = [];
  if (!Array.isArray(v.retailDiscs)) v.retailDiscs = [];
  if (!Array.isArray(v.retailSel)) v.retailSel = [];
  for (var i = 0; i < bn; i++) {
    v.coefs[i] = parseFloat(v.coefs[i]);
    if (!isFinite(v.coefs[i]) || v.coefs[i] <= 0) v.coefs[i] = 1;
    v.retailDiscs[i] = parseFloat(v.retailDiscs[i]);
    if (!isFinite(v.retailDiscs[i]) || v.retailDiscs[i] <= 0) v.retailDiscs[i] = 1;
    if (!v.retailSel[i] || BRANDS.indexOf(v.retailSel[i]) < 0) v.retailSel[i] = BRANDS[i] || BRANDS[0];
  }
  v.coefs = v.coefs.slice(0, bn);
  v.retailDiscs = v.retailDiscs.slice(0, bn);
  v.retailSel = v.retailSel.slice(0, bn);
  if (!Array.isArray(v.costDiscs)) v.costDiscs = [];
  for (var ci = 0; ci < bn; ci++) {
    v.costDiscs[ci] = parseFloat(v.costDiscs[ci]);
    if (!isFinite(v.costDiscs[ci]) || v.costDiscs[ci] <= 0) {
      var legacyCd = parseFloat(v.costDisc);
      v.costDiscs[ci] = (isFinite(legacyCd) && legacyCd > 0) ? legacyCd : 1;
    }
  }
  v.costDiscs = v.costDiscs.slice(0, bn);
  delete v.costDisc;
  delete v.blocks;
}

/* ---------- 商品索引 ---------- */
var _pIndex = null;
function invalidateIndex() { _pIndex = null; }
function pIndex() {
  if (_pIndex) return _pIndex;
  _pIndex = { exact: {}, fuzzy: {} };
  state.products.forEach(function (p) {
    _pIndex.exact[p.name + '|' + p.spec] = p;
    var fk = p.name + '|' + normSpec(p.spec);
    if (!_pIndex.fuzzy[fk]) _pIndex.fuzzy[fk] = p;
  });
  return _pIndex;
}
function normSpec(s) { return (s == null ? '' : '' + s).replace(/\s+/g, '').replace(/[ⅠⅡⅢ]/g, '').replace(/[*xX×]/g, 'x').toUpperCase(); }
function findProduct(name, spec) {
  if (!name) return null;
  var ix = pIndex();
  return ix.exact[name + '|' + spec] || ix.fuzzy[name + '|' + normSpec(spec)] || null;
}

/* ---------- 品牌参数：4 组可调，其余品牌按 1 ---------- */
var _pm = null;
function brandParams() {
  if (_pm) return _pm;
  var m = {};
  BRANDS.forEach(function (b) { m[b] = { coef: 1, disc: 1, group: -1 }; });
  for (var j = 0; j < state.view.brandCount; j++) {
    var b = state.view.retailSel[j];
    if (b && m[b]) { m[b].coef = state.view.coefs[j]; m[b].disc = state.view.retailDiscs[j]; m[b].group = j; }
  }
  _pm = m;
  return m;
}
/* ---------- 计算：只看工具条筛选的 4 个品牌（各自系数/折扣） ---------- */
function selBrand(j) { return BRANDS.indexOf(state.view.retailSel[j]); }
function calcOrderSel(oid) {
  var bn = state.view.brandCount;
  var t = { qty: 0, R: zeros(bn), W: zeros(bn), F: zeros(bn), C: zeros(bn) };
  var o = state.orders[oid];
  if (!o) return t;
  o.rows.forEach(function (r) {
    var p = findProduct(r.name, r.spec);
    var q = num(r.qty);
    t.qty += q;
    if (!p) return;
    for (var j = 0; j < bn; j++) {
      var bi = selBrand(j);
      if (bi < 0) continue;
      t.R[j] += q * (p.retail[bi] || 0) * state.view.retailDiscs[j];
      t.W[j] += q * (p.price[bi] || 0) / state.view.coefs[j];
      t.F[j] += q * (p.welfare[bi] || 0);
      t.C[j] += q * (p.cost[bi] || 0) * state.view.costDiscs[j];
    }
  });
  return t;
}
function comparedOrders() {
  return Object.keys(state.orders).filter(function (oid) {
    var o = state.orders[oid];
    return o && o.compare !== false;
  });
}
function calcSummarySel() {
  var keys = comparedOrders();
  var bn = state.view.brandCount;
  var acc = { R: zeros(bn), W: zeros(bn), F: zeros(bn), C: zeros(bn) };
  keys.forEach(function (oid) {
    var t = calcOrderSel(oid);
    for (var j = 0; j < bn; j++) { acc.R[j] += t.R[j]; acc.W[j] += t.W[j]; acc.F[j] += t.F[j]; acc.C[j] += t.C[j]; }
  });
  var n = keys.length || 1;
  var avgR = [], avgW = [], avgF = [], avgC = [];
  for (var j = 0; j < bn; j++) {
    avgR.push(acc.R[j] / n); avgW.push(acc.W[j] / n); avgF.push(acc.F[j] / n); avgC.push(acc.C[j] / n);
  }
  return { n: n, avgR: avgR, avgW: avgW, avgF: avgF, avgC: avgC, sumR: acc.R, sumW: acc.W, sumF: acc.F, sumC: acc.C };
}

function productOptions(selKey, row) {

    h += '<optgroup label="' + esc(n) + '">';

  return h;
}

    '<th style="width:170px">指标</th>';

  var dealer = s.avgR.map(function (x, i) { return x - s.avgW[i]; });

/* ---------- 导出 ---------- */
function download(filename, content, mime) {
  var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function csvCell(v) {
  var s = v == null ? '' : '' + v;
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function toCsv(rows) { return '\uFEFF' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'); }
function today() { return new Date().toISOString().slice(0, 10); }
function exportSummary() {
  var s = calcSummarySel();
  var names = state.view.retailSel;
  var keys = comparedOrders();
  var rows = [];
  rows.push(['各套对比（参与对比 ' + keys.length + ' 套）']);
  var h1 = ['套数'];
  names.forEach(function (nm) {
    h1.push(nm + '·零售价', nm + '·批发价', nm + '·水工福利');
    if (!SALES_MODE) h1.push(nm + '·成本');
  });
  rows.push(h1);
  keys.forEach(function (oid) {
    var t = calcOrderSel(oid);
    var r = [oid];
    for (var j = 0; j < names.length; j++) {
      r.push(t.R[j].toFixed(2), t.W[j].toFixed(2), t.F[j].toFixed(2));
      if (!SALES_MODE) r.push(t.C[j].toFixed(2));
    }
    rows.push(r);
  });
  rows.push([]);
  rows.push(['平均指标（共 ' + s.n + ' 套）']);
  rows.push(['指标'].concat(names).concat([names.length + '品牌合计']));
  function addRow(label, arr, mode) {
    var r = [label];
    var sum = 0;
    arr.forEach(function (x) { sum += x; r.push(x.toFixed(2)); });
    r.push((mode === 'avg' ? sum / arr.length : sum).toFixed(2));
    rows.push(r);
  }
  addRow('平均零售价', s.avgR, 'avg');
  addRow('平均批发价', s.avgW, 'avg');
  addRow('平均经销商利润', s.avgR.map(function (v, i) { return v - s.avgW[i]; }), 'avg');
  addRow('平均水工福利', s.avgF, 'avg');
  if (!SALES_MODE) {
    addRow('平均成本', s.avgC, 'avg');
    addRow('平均代理商利润', s.avgW.map(function (v, i) { return v - s.avgC[i] - s.avgF[i]; }), 'avg');
  }
  rows.push([]);
  rows.push(['套数', s.n]);
  for (var j = 0; j < names.length; j++) {
    var pr = ['参数：品牌' + (j + 1), state.view.retailSel[j], '批发系数', state.view.coefs[j], '零售折扣', state.view.retailDiscs[j]];
    if (!SALES_MODE) pr.push('成本折扣', state.view.costDiscs[j]);
    rows.push(pr);
  }
  download('价格汇总-' + today() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
}
function exportOrders(onlyOid) {
  var head = ['套数', '行号', '商品名称', '规格', '数量', '单位'];
  var bn = state.view.brandCount;
  for (var j = 0; j < bn; j++) {
    var b = state.view.retailSel[j];
    head.push('零售单价·' + b, '零售小计·' + b, '批发单价·' + b, '批发小计·' + b);
    if (!SALES_MODE) head.push('成本单价·' + b, '成本小计·' + b);
    head.push('福利单价·' + b, '福利小计·' + b);
  }
  var rows = [head];
  var keys = onlyOid ? [onlyOid] : Object.keys(state.orders);
  keys.forEach(function (oid) {
    var o = state.orders[oid];
    if (!o) return;
    o.rows.forEach(function (r, i) {
      var p = findProduct(r.name, r.spec);
      var q = num(r.qty);
      var row = [oid, i + 1, r.name, r.spec, q, p ? p.unit : (r.unit || '')];
      for (var j = 0; j < bn; j++) {
        var bi = BRANDS.indexOf(state.view.retailSel[j]);
        if (!p || bi < 0) {
          var empty = ['0.00', '0.00', '0.00', '0.00'];
          if (!SALES_MODE) empty.push('0.00', '0.00');
          empty.push('0.00', '0.00');
          for (var ek = 0; ek < empty.length; ek++) row.push(empty[ek]);
          continue;
        }
        var ru = (p.retail[bi] || 0) * state.view.retailDiscs[j];
        var wu = (p.price[bi] || 0) / state.view.coefs[j];
        var cu = (p.cost[bi] || 0) * state.view.costDiscs[j];
        var fu = (p.welfare[bi] || 0);
        row.push(ru.toFixed(2), (q * ru).toFixed(2), wu.toFixed(2), (q * wu).toFixed(2));
        if (!SALES_MODE) row.push(cu.toFixed(2), (q * cu).toFixed(2));
        row.push(fu.toFixed(2), (q * fu).toFixed(2));
      }
      rows.push(row);
    });
  });
  download((onlyOid ? '订单明细-' + onlyOid : '户型明细') + '-' + today() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
}

/* ---------- 事件：点击 ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'tab') { state.view.tab = t.getAttribute('data-tab'); save(); renderApp(); }
  else if (act === 'book') { state.view.book = t.getAttribute('data-book'); save(); renderApp(); }
  else if (act === 'order') { state.view.order = t.getAttribute('data-oid'); save(); renderApp(); }
  else if (act === 'new-order') {
    var no = 1, nid = '空白套' + no;
    while (state.orders[nid]) { no++; nid = '空白套' + no; }
    var nm = prompt('新套数名称：', nid);
    if (nm == null) return;
    nm = nm.trim() || nid;
    if (state.orders[nm]) { alert('已存在同名套数：' + nm); return; }
    state.orders[nm] = { rows: [{ name: '', spec: '', qty: 1, unit: '' }], compare: true, custom: true };
    state.view.order = nm;
    save(); renderApp();
  }
  else if (act === 'del-order') {
    var doid = t.getAttribute('data-oid');
    if (!confirm('确定删除套数「' + doid + '」？')) return;
    delete state.orders[doid];
    if (state.view.order === doid) state.view.order = '';
    save(); renderApp();
  }
  else if (act === 'add-row') {
    state.orders[t.getAttribute('data-oid')].rows.push({ name: '', spec: '', qty: 0, unit: '' });
    save(); renderApp();
  }
  else if (act === 'del-row') {
    state.orders[t.getAttribute('data-oid')].rows.splice(+t.getAttribute('data-idx'), 1);
    save(); renderApp();
  }
  else if (act === 'add-product') {
    var pn = prompt('商品名称：'); if (!pn) return;
    var ps = prompt('规格：'); if (ps == null) return;
    var pu = prompt('单位（如：个 / 条）：'); if (pu == null) return;
    state.products.push({
      name: pn.trim(), spec: ps.trim(), unit: pu.trim(),
      price: zeros(BRANDS.length), retail: zeros(BRANDS.length), welfare: zeros(BRANDS.length), cost: zeros(BRANDS.length)
    });
    invalidateIndex(); save(); renderApp();
  }
  else if (act === 'del-product') {
    var dp = state.products[+t.getAttribute('data-pidx')];
    if (!confirm('确定删除产品「' + dp.name + ' ' + dp.spec + '」？引用它的订单行将显示为未匹配。')) return;
    state.products.splice(+t.getAttribute('data-pidx'), 1);
    invalidateIndex(); save(); renderApp();
  }
  else if (act === 'export-summary') { exportSummary(); }
  else if (act === 'export-order-one') { exportOrders(t.getAttribute('data-oid')); }
  else if (act === 'export-orders') { exportOrders(); }
  else if (act === 'backup') { download('价格核算备份-' + today() + '.json', JSON.stringify(state), 'application/json'); }
  else if (act === 'import') { document.getElementById('importFile').click(); }
  else if (act === 'reset') {
    if (!confirm('确定恢复初始数据？你修改过的价格、订单、参数都会清空！')) return;
    localStorage.removeItem(LSKEY);
    state = deepCopy(SEED);
    _pm = null;
    invalidateIndex(); save(); renderApp();
  }
  else if (act === 'logout') { doLogout(); }
});

/* ---------- 事件：修改 ---------- */
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var act = t.getAttribute('data-act');
  if (act === 'row-product') {
    var oid = t.getAttribute('data-oid');
    var idx = +t.getAttribute('data-idx');
    var parts = t.value.split('|');
    var r = state.orders[oid].rows[idx];
    r.name = parts.shift() || '';
    r.spec = parts.join('|');
    save(); renderApp();
  }
  else if (act === 'order-compare') {
    var coid = t.getAttribute('data-oid');
    if (state.orders[coid]) state.orders[coid].compare = !!t.checked;
    save();
  }
  else if (act === 'set-brandcount') {
    var bc = parseInt(t.value, 10);
    if (!isFinite(bc)) bc = 4;
    state.view.brandCount = Math.max(2, Math.min(10, bc));
    migrate(); save(); renderApp();
  }
  else if (act === 'set-coef') {
    var cf = parseFloat(t.value);
    var cj = +t.getAttribute('data-j');
    if (!isFinite(cf) || cf <= 0) { alert('批发系数必须大于 0'); t.value = state.view.coefs[cj]; return; }
    state.view.coefs[cj] = cf;
    save(); renderApp();
  }
  else if (act === 'set-retaildisc') {
    var rd = parseFloat(t.value);
    var rj = +t.getAttribute('data-j');
    if (!isFinite(rd) || rd <= 0) { alert('零售折扣必须大于 0'); t.value = state.view.retailDiscs[rj]; return; }
    state.view.retailDiscs[rj] = rd;
    save(); renderApp();
  }
  else if (act === 'set-costdisc') {
    var cd = parseFloat(t.value);
    var cj = +t.getAttribute('data-j');
    if (!isFinite(cd) || cd <= 0) { alert('成本折扣必须大于 0'); t.value = state.view.costDiscs[cj]; return; }
    state.view.costDiscs[cj] = cd;
    save(); renderApp();
  }
  else if (act === 'set-col') {
    var bk = t.getAttribute('data-book');
    if (bk.indexOf('retail') === 0) state.view.retailSel[+bk.slice(6)] = t.value;
    save(); renderApp();
  }
  else if (act === 'book-cell') {
    var p = state.products[+t.getAttribute('data-pidx')];
    if (p) {
      p[t.getAttribute('data-book')][+t.getAttribute('data-idx')] = num(t.value);
      save();
    }
  }
  else if (act === 'book-text') {
    var p2 = state.products[+t.getAttribute('data-pidx')];
    if (p2) {
      p2[t.getAttribute('data-field')] = t.value;
      invalidateIndex(); save();
    }
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  if (t.getAttribute('data-act') === 'row-qty') {
    var oid = t.getAttribute('data-oid');
    var idx = +t.getAttribute('data-idx');
    state.orders[oid].rows[idx].qty = num(t.value);
    save();
  }
});

/* ---------- 导入文件 ---------- */
document.getElementById('importFile').addEventListener('change', function () {
  var f = this.files[0];
  this.value = '';
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var obj = JSON.parse(reader.result);
      if (!obj || !obj.products || !obj.orders || !obj.brands) throw new Error('格式不对');
      state = obj;
      _pm = null;
      invalidateIndex(); save(); renderApp();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(f, 'utf-8');
});

/* ---------- SHA-256 ---------- */
function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), result = '';
  var words = [], asciiBitLength = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [];
  var primeCounter = k.length;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (var j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
          w[i - 16]
          + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
          + w[i - 7]
          + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
        ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (var i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (var i = 0; i < 8; i++) {
    for (var j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}
function utf8Encode(s) { return unescape(encodeURIComponent(s)); }

/* ---------- 登录 ---------- */
var AUTH_HASH = '2a9e5141205c941e94e13e0bded7f8d4d8ae862b8fb31d7889ea7160eef02f79';
var SESSION_KEY = 'qz_mx_login_ok';
function isLoggedIn() { return sessionStorage.getItem(SESSION_KEY) === '1'; }
function showLogin() { document.getElementById('loginMask').style.display = 'flex'; }
function hideLogin() { document.getElementById('loginMask').style.display = 'none'; }
function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  if (sha256(utf8Encode(u + '|' + p)) === AUTH_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    hideLogin();
    migrate();
    renderApp();
  } else {
    document.getElementById('loginErr').textContent = '账号或密码错误';
    document.getElementById('loginPass').value = '';
  }
}
function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

/* ---------- 启动 ---------- */
if (isLoggedIn()) {
  migrate();
  renderApp();
} else {
  showLogin();
}
