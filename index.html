<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泉州价格体系核算系统</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: linear-gradient(140deg, #0d3b23 0%, #14532d 45%, #1e7a3f 100%);
    color: #fff; padding: 32px 18px;
  }
  .head { text-align: center; margin-bottom: 34px; }
  .head h1 { margin: 0 0 10px; font-size: 30px; font-weight: 600; letter-spacing: 1px; }
  .head p { margin: 0; color: rgba(255,255,255,.72); font-size: 14px; }
  .cards { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 820px; }
  .card {
    flex: 1 1 320px; max-width: 380px; background: #fff; color: #222; border-radius: 14px;
    padding: 26px 28px 24px; text-decoration: none; display: block; position: relative;
    box-shadow: 0 14px 40px rgba(0,0,0,.25); transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 20px 52px rgba(0,0,0,.32); }
  .card h2 { margin: 0 0 8px; font-size: 20px; color: #14532d; }
  .card .tag {
    display: inline-block; font-size: 12px; border-radius: 20px; padding: 2px 10px; margin-bottom: 14px;
    background: #e8f5ec; color: #14532d; border: 1px solid #cfe8d8;
  }
  .card.sales .tag { background: #eef2fb; color: #2f4b8f; border-color: #d6e0f4; }
  .card.sales h2 { color: #2f4b8f; }
  .card ul { margin: 0 0 20px; padding-left: 18px; color: #555; font-size: 13.5px; line-height: 1.9; }
  .card .go {
    display: inline-block; background: #14532d; color: #fff; border-radius: 6px;
    padding: 9px 20px; font-size: 14px;
  }
  .card.sales .go { background: #2f4b8f; }
  .foot { margin-top: 30px; color: rgba(255,255,255,.55); font-size: 12.5px; text-align: center; line-height: 1.8; }
  @media (max-width: 640px) { .head h1 { font-size: 23px; } }
</style>
</head>
<body>
  <div class="head">
    <h1>泉州价格体系核算系统</h1>
    <p>请选择版本入口，使用分配到的账号登录</p>
  </div>
  <div class="cards">
    <a class="card" href="full.html">
      <span class="tag">完整版 · 内部使用</span>
      <h2>价格核算系统（完整版）</h2>
      <ul>
        <li>零售价 / 批发价 / 成本 / 水工福利对比</li>
        <li>经销商利润、代理商利润</li>
        <li>支持 2–10 个品牌对比与汇总导出</li>
      </ul>
      <span class="go">进入完整版 →</span>
    </a>
    <a class="card sales" href="sales.html">
      <span class="tag">业务员版 · 对外使用</span>
      <h2>价格核算系统（业务员版）</h2>
      <ul>
        <li>零售价 / 批发价 / 水工福利对比</li>
        <li>经销商利润</li>
        <li>不含成本与代理商利润，便于对外报价</li>
      </ul>
      <span class="go">进入业务员版 →</span>
    </a>
  </div>
  <div class="foot">
    泉州明翔 · 价格体系核算<br>
    两个版本保存的数据相互独立，互不影响
  </div>
</body>
</html>
